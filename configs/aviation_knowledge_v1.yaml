    ingestion_scope:
      mode: bounded
      service_date_from: 2026-05-20
      service_date_to: 2026-05-20
      routes:
        - [ATL, JFK]
        - [JFK, ATL]
        - [ATL, EWR]
        - [EWR, ATL]
        - [ATL, LGA]
        - [LGA, ATL]
      selection_basis: single-day overlap across configured advisory, weather, flight, registry, and NASR sources
    origin_timezones:
      ATL: America/New_York
      JFK: America/New_York
      EWR: America/New_York
      LGA: America/New_York
    role: public_flight_operation_records
  faa_aircraft_registry:
