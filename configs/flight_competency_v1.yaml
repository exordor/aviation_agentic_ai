schema_version: flight-competency-supplement-config-v1

canonical_public_sample:
  id: nasa-atmonto-plus-nyc-2014-07-15
  primary_source_id: nasa_atmonto_plus
  source_role: canonical_public_cross_source_sample
  selection_basis: >-
    The public atmontoPlus documentary bundle provides Flight and trajectory,
    METAR, TAF, ASPM, TMI, and infrastructure records around one primary date.
  temporal_scope:
    primary_date: "2014-07-15"
    flight_departure_start_utc: "2014-07-15T00:01:00Z"
    flight_departure_end_utc: "2014-07-15T23:59:00Z"
    arrival_spillover_end_utc: "2014-07-16T04:54:00Z"
  geographic_scope:
    flight_weather_aspm_airports:
      - KJFK
      - KEWR
      - KLGA
    tmi: all_nas_issued_on_sample_date
  temporal_selection:
    taf: issued_on_sample_date
    tmi: issued_on_sample_date
  inventory:
    flights: 100
    metar_reports: 130
    taf_reports: 42
    aspm_airport_hours: 72
    traffic_management_initiatives: 80
  overlap_reference_inventory:
    taf_reports: 66
    traffic_management_initiatives: 114
  limitations:
    - >-
      This is the 100-flight documentary subset, not the private
      approximately 100,000-flight ATMGRAPH.
    - ASPM metrics are airport-hour observations, not flight-level outcomes.

sources:
  nasa_atmonto_plus:
    path: data/raw/nasa_atmonto_prototype/allFilesTTL.zip
    url: https://data.nasa.gov/docs/ontologies/atmonto/allFilesTTL.zip
    sha256: 93dc9675772649079bef11fe3519e6d99fe0d549318a6696af888b7f2b74df47
    role: published_2014_flight_track_and_sector_sample
    source_role: canonical_public_sample_bundle
    selection_basis: >-
      Supplies the only public NASA date with all canonical sample layers in
      one checksum-pinned artifact.
    temporal_scope: "2014-07-15; 100 JFK/EWR/LGA flights"
    license_url: https://data.nasa.gov/docs/ontologies/atmonto/license.html
    retrieved_on: "2026-07-30"
    limitations:
      - Full NASA ATMGRAPH storage is not publicly accessible.
      - Flight records are a 100-flight sample selected from the July 2014 graph.

  bts_on_time_2026_05:
    path: data/raw/bts/On_Time_Reporting_Carrier_On_Time_Performance_1987_present_2026_5.zip
    url: https://transtats.bts.gov/PREZIP/On_Time_Reporting_Carrier_On_Time_Performance_1987_present_2026_5.zip
    sha256: 4e7b96999440afec8c92dd23bfbc68a5852e14d9a56c3d0d366f884542ea80b3
    role: public_flight_operation_records
    source_role: optional_raw_source_supplement
    selection_basis: >-
      Optional adapter and scalability source; it is not evidence for the
      canonical 2014 public sample.
    temporal_scope: "2026-05"
    cross_temporal_join_allowed: false
    limitations:
      - Do not link these 2026 rows to the 2014 NASA sample.
      - The full monthly archive is not part of the default prototype slice.

  faa_nasr_2026_05_14:
    path: data/raw/nasa_atmonto/2026-05-14/faa_nasr/28DaySubscription_Effective_2026-05-14.zip
    url: https://nfdc.faa.gov/webContent/28DaySub/28DaySubscription_Effective_2026-05-14.zip
    sha256: db4793352229c1fd74e9b3d924762376abfa224fe6388768cad25d084c7aeed3
    role: airport_to_artcc_reference_snapshot
    temporal_scope: "effective 2026-05-14 through 2026-06-10"
    retrieved_on: "2026-06-01"

  faa_aircraft_registry_2026_07_28:
    path: data/raw/flight_competency/ReleasableAircraft_2026-07-28.zip
    url: https://registry.faa.gov/database/ReleasableAircraft.zip
    sha256: 8e42c757a3db24cfcd76638f04d151aa2843bd77d5358f7f847fa661331efe7a
    role: non_personal_aircraft_manufacturer_model_lookup
    temporal_scope: "registry files dated 2026-07-28"
    retrieved_on: "2026-07-30"

  iem_katl_metar_2026_05_14_22:
    path: data/raw/flight_competency/katl_asos_2026-05-14_2026-05-22.csv
    url: "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?station=ATL&data=all&year1=2026&month1=5&day1=14&year2=2026&month2=5&day2=22&tz=UTC&format=onlycomma&latlon=yes&elev=yes&missing=null&trace=0.0001&direct=no&report_type=3&report_type=4"
    sha256: be6ef673b82cf39779aacaa57008372464f1a81951c692e08a09689223371f85
    role: historical_katl_metar_routine_and_special_observations
    temporal_scope: "2026-05-14T00:00Z through 2026-05-22T00:00Z"
    retrieved_on: "2026-07-30"

query_scope:
  canonical_source_id: nasa_atmonto_plus
  canonical_date: "2014-07-15"
  optional_proxy_queries_below: true
  limitations:
    - F1 and F3S below are historical 2026 proxy checks, not canonical-case queries.
    - No query may combine their 2026 records with the 2014 public sample.

queries:
  F1:
    artcc: ZTL
    start_date: "2026-05-01"
    end_date: "2026-06-01"

  F3S:
    airport: ATL
    airport_timezone: America/New_York
    start: "2026-05-14T00:00:00"
    end: "2026-05-22T00:00:00"
    max_minutes: 30

  S4:
    hour_utc: 2

  S1S:
    sector_id: https://data.nasa.gov/ontologies/atmonto/NAS#ZTLsector040
    max_minutes: 30

outputs:
  json: reports/stages/atmonto_competency_query_supplement_v1.json
  markdown: reports/stages/atmonto_competency_query_supplement_v1.md
