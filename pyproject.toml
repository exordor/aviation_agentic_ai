[project]
name = "aviation-agentic-ai"
version = "0.1.0"
description = "Source-bounded multi-Agent system for aviation event knowledge construction and querying."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jiale" }
]
dependencies = [
  "click>=8.1",
  "docling>=2.96.0",
  "httpx>=0.28",
  "pdfplumber>=0.11.9",
  "pydantic>=2.7",
  "pymupdf>=1.24",
  "pypdf>=6.12.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rdflib>=7.0",
  "rich>=15.0",
  "scrapy>=2.13",
  "tenacity>=9.1",
]

[project.optional-dependencies]
ontology-generation = [
  "langchain>=0.2",
  "langchain-openai>=0.1",
  "langgraph>=0.2",
]
graphrag = [
  "chromadb>=1.5,<2",
  "networkx>=3.2",
  "sentence-transformers>=3.0",
]
case-retrieval = [
  "chromadb>=1.5,<2",
  "sentence-transformers>=3.0",
]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
ontogpt = [
  "ontogpt>=1.1",
]
neo4j = [
  "neo4j>=6.0,<7",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
aviation-ai = "aviation_agentic_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aviation_agentic_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
